[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zipserv-vllm"
version = "0.1.0"
description = "Experimental lossless BF16 ZipServ plugin for vLLM 0.32.0"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["vllm==0.32.0"]

[project.entry-points."vllm.general_plugins"]
zipserv = "zipserv_vllm:register"

[tool.setuptools.packages.find]
where = ["."]
include = ["zipserv_vllm*"]

[tool.setuptools.package-data]
zipserv_vllm = ["LICENSE", "NOTICE"]
