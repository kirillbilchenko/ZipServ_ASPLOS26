[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zipserv-vllm"
version = "0.1.0"
description = "Experimental lossless BF16, MXFP4 and NVFP4 scale compression for vLLM"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["packaging>=24"]

[project.optional-dependencies]
vllm = ["vllm>=0.31.0,<0.33.0"]

[project.entry-points."vllm.general_plugins"]
zipserv = "zipserv_vllm:register"
zipserv_scale_cache = "zipserv_vllm.scale_cache_plugin:register"
zipserv_mxfp4_scales = "zipserv_vllm.mxfp4_plugin:register"
zipserv_mixed_weights = "zipserv_vllm.mixed_plugin:register"
zipserv_nvfp4_scales = "zipserv_vllm.nvfp4_plugin:register"

[tool.setuptools.packages.find]
where = ["."]
include = ["zipserv_vllm*"]

[tool.setuptools.package-data]
zipserv_vllm = ["LICENSE", "NOTICE", "compression-provenance.json", "mxfp4-provenance.json", "nvfp4-provenance.json", "vllm-compatibility.json"]
